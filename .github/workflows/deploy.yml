name: Deploy VEY RASHA Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect frontend project directory
        id: project_dir
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "package.json" ] && [ -f "vite.config.ts" ]; then
            DIR="."
          else
            FOUND_PKG="$(find . -maxdepth 3 -name 'package.json' -not -path '*/node_modules/*' -not -path '*/dist/*' | head -n 1 || true)"
            if [ -z "$FOUND_PKG" ]; then
              echo "::error::Could not locate package.json in repository."
              exit 1
            fi
            DIR="$(dirname "$FOUND_PKG")"
          fi
          DIR="${DIR#./}"
          [ -z "$DIR" ] && DIR="."
          if [ ! -f "${DIR}/bun.lock" ]; then
            echo "::error::Expected bun.lock in ${DIR}, but it was not found."
            exit 1
          fi
          echo "path=${DIR}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: ${{ steps.project_dir.outputs.path }}
        run: bun install --frozen-lockfile

      - name: Type-check TypeScript
        working-directory: ${{ steps.project_dir.outputs.path }}
        run: bun run lint

      - name: Resolve GitHub Pages base path
        id: base_path
        working-directory: ${{ steps.project_dir.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ vars.VITE_BASE_PATH }}" ]; then
            echo "value=${{ vars.VITE_BASE_PATH }}" >> "$GITHUB_OUTPUT"
          else
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            OWNER_PAGES_REPO="${GITHUB_REPOSITORY_OWNER}.github.io"
            if [ "$REPO_NAME" = "$OWNER_PAGES_REPO" ]; then
              echo "value=/" >> "$GITHUB_OUTPUT"
            else
              echo "value=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build production frontend bundle
        working-directory: ${{ steps.project_dir.outputs.path }}
        env:
          VITE_BASE_PATH: ${{ steps.base_path.outputs.value }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: bun run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project_dir.outputs.path }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
