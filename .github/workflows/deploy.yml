name: Deploy VEY RASHA Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run lint

      - name: Resolve GitHub Pages base path
        id: base_path
        shell: bash
        run: |
          if [ -n "${{ vars.VITE_BASE_PATH }}" ]; then
            echo "value=${{ vars.VITE_BASE_PATH }}" >> "$GITHUB_OUTPUT"
          else
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            OWNER_PAGES_REPO="${GITHUB_REPOSITORY_OWNER}.github.io"
            if [ "$REPO_NAME" = "$OWNER_PAGES_REPO" ]; then
              echo "value=/" >> "$GITHUB_OUTPUT"
            else
              echo "value=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build production frontend bundle
        env:
          VITE_BASE_PATH: ${{ steps.base_path.outputs.value }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
