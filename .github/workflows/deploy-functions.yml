name: Deploy Supabase Edge Functions

# Deploys supabase/functions/create-order to your Supabase project.
# Run it by hand: GitHub -> Actions -> "Deploy Supabase Edge Functions" -> Run workflow.
# It also re-deploys automatically whenever files in supabase/functions change on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

permissions:
  contents: read

concurrency:
  group: supabase-functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN"; exit 1; fi
          if [ -z "${PROJECT_REF:-}" ]; then echo "Missing GitHub secret SUPABASE_PROJECT_REF"; exit 1; fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Make sure a Supabase project folder exists
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/config.toml || supabase init
          ls supabase/functions

      - name: Deploy create-order
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy create-order --project-ref "$PROJECT_REF" --use-api
